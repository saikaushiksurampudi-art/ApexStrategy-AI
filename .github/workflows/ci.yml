name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests

      - name: Run tests
        working-directory: backend
        # Tests use an in-memory SQLite database and never touch the network.
        run: pytest --cov=app --cov-report=term-missing

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict || \
            echo "::warning::pip-audit reported findings - review before release"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: apexstrategy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name apex -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./ci.db apexstrategy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "Health check passed"
              curl -s http://localhost:8000/api/health
              docker rm -f apex
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs apex
          exit 1

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt playwright pytest-playwright
          python -m playwright install --with-deps chromium
          cd frontend && npm ci --no-audit --no-fund

      - name: Seed a minimal dataset
        working-directory: backend
        # One season keeps CI fast; the suite exercises the UI, not the volume.
        run: |
          python -m scripts.ingest --seasons 2024 --no-pitstops
          python -m scripts.train_model --train-seasons 2024 --test-seasons 2024 || true

      - name: Start the servers
        run: |
          cd backend && python -m uvicorn app.main:app --port 8000 &
          cd frontend && npm run dev &
          npx wait-on http://127.0.0.1:8000/api/health http://127.0.0.1:5173 -t 90000

      - name: Run end-to-end tests
        run: python -m pytest tests/e2e -q

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          if-no-files-found: ignore
