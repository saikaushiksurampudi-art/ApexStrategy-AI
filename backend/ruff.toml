line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
    # The codebase uses typing.List/Dict/Optional consistently throughout.
    # `from __future__ import annotations` is present everywhere, so this is a
    # style choice rather than a compatibility one; a mechanical rewrite would
    # touch 182 sites for no behavioural gain.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
"migrations/*" = ["E402", "F401", "I001"]
"scripts/*" = ["E402"]
