# AWS App Runner service configuration (source-code deployment from GitHub).
#
# This is the self-contained demo deployment: the build loads five seasons of
# F1 data into SQLite and trains the model, so the running service needs no
# database server, no S3 and no first-run step. The data is historical and
# read-mostly, so SQLite is enough; accounts and feedback live in the same file
# and reset whenever a new version deploys. For persistent accounts, switch to
# RDS as described in docs/DEPLOYMENT.md.
#
# Ingestion reads backend/data/cache (committed API responses), so the build
# does not depend on the Jolpica API being up. Portraits are fetched live from
# Wikimedia; any that fail fall back to monograms rather than failing the build.

version: 1.0
runtime: python311

build:
  commands:
    pre-build:
      # The Python image may not ship Node; Vite 5 needs Node 18+.
      - command -v npm || dnf install -y nodejs npm
      - (cd frontend && npm ci --no-audit --no-fund && npm run build)
    build:
      - pip3 install -r backend/requirements.txt
      - (cd backend && python3 -m scripts.ingest && python3 -m scripts.fetch_portraits && python3 -m scripts.train_model)

run:
  # Packages installed during the build stage do not carry over to the run
  # image on this runtime, so they are installed again before start-up.
  pre-run:
    - pip3 install -r backend/requirements.txt
  command: sh -c "cd backend && python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers"
  network:
    port: 8000
    env: PORT
  env:
    - name: ENVIRONMENT
      value: production
    - name: DEBUG
      value: 'false'
    - name: AWS_REGION
      value: us-east-1
    # The analyst uses the built-in grounded writer. Set to 'true' (and grant
    # the instance role bedrock:InvokeModel) to answer with Claude on Bedrock.
    - name: ENABLE_BEDROCK
      value: 'false'
  secrets:
    # Resolved from AWS Secrets Manager at start-up via the instance role.
    # The ARN is not sensitive; the value never leaves Secrets Manager.
    - name: JWT_SECRET
      value: arn:aws:secretsmanager:us-east-1:053578820492:secret:apexstrategy/jwt-nV2EJH
